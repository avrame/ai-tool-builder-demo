<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Tool Builder Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!-- Fix for Chrome mobile Map.prototype worker boundary bug -->
    <script>
      // Patch Map.prototype to handle "incompatible receiver" errors
      // This happens on mobile Chrome when Map objects cross Web Worker boundaries
      (function() {
        const OrigMap = Map;
        const origKeys = OrigMap.prototype.keys;
        const origValues = OrigMap.prototype.values;
        const origEntries = OrigMap.prototype.entries;
        const origForEach = OrigMap.prototype.forEach;
        const origIterator = OrigMap.prototype[Symbol.iterator];

        function safeCall(fn, self, args) {
          try {
            return fn.apply(self, args);
          } catch(e) {
            if (e && typeof e === 'object' && 'message' in e &&
                String(e.message).includes('incompatible receiver')) {
              // Object lost prototype chain across worker boundary
              // Reconstruct as fresh Map and retry
              const fresh = new OrigMap();
              try {
                // Try Object.entries as fallback
                for (const k of Object.keys(self)) {
                  fresh.set(k, self[k]);
                }
              } catch(_) {}
              return fn.apply(fresh, args);
            }
            throw e;
          }
        }

        OrigMap.prototype.keys = function(...args) { return safeCall(origKeys, this, args); };
        OrigMap.prototype.values = function(...args) { return safeCall(origValues, this, args); };
        OrigMap.prototype.entries = function(...args) { return safeCall(origEntries, this, args); };
        OrigMap.prototype.forEach = function(...args) { return safeCall(origForEach, this, args); };
        OrigMap.prototype[Symbol.iterator] = function(...args) { return safeCall(origIterator, this, args); };
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
